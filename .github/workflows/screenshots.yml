name: Vérifier Flutter et capturer les écrans
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/capture.mjs'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cv-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter create --platforms=android,ios,web .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Capturer les quatre pages
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory build/web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:8080/ >/dev/null
          node tool/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: captures-flutter
          path: docs/screenshots/*.png
      - name: Ajouter les captures au dépôt
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Mettre à jour les captures Flutter"
          git push
